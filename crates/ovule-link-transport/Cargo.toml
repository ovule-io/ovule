[package]
name = "ovule-link-transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
async-trait = "0.1"
serde_json = "1"
ovule-link-protocol = { workspace = true }
iroh = { version = "1.2", default-features = false, features = ["portmapper", "tls-ring"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt", "io-util", "sync", "time"] }

[lints]
workspace = true
