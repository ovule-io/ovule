[package]
name = "ovule-workspace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ovule-memory = { workspace = true }
ovule-storage = { workspace = true }
ovule-toolchains = { workspace = true }
ovule-remoting = { workspace = true }
ovule-hosts = { workspace = true }
ovule-secrets = { workspace = true }
ovule-platform = { workspace = true }
tuffite-ioc = { workspace = true }
ovule-settings = { workspace = true }
ovule-extension-api = { workspace = true }

tracing.workspace = true
tuffite = { workspace = true, optional = true }

iroh = { version = "1.2", default-features = false, features = [
  "portmapper",
  "tls-ring",
] }
json5 = "1.3"
russh = { version = "0.63", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "net", "time"] }
url = "2"

[features]
framework = ["dep:tuffite"]
test-support = ["ovule-settings/test-driver"]

[dev-dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
ovule-settings = { workspace = true, features = ["test-driver"] }
tempfile = "3"
