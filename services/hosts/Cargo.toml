[package]
name = "ovule-hosts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
ssh_transport = []

[dependencies]
rmcp = { version = "3.4", default-features = false, features = ["client", "server", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }

ovule-agent-api.workspace = true
tuffite-ioc = { workspace = true }
ovule-link-protocol = { workspace = true }
ovule-link-transport = { workspace = true }
ovule-remoting = { workspace = true }
ovule-secrets = { workspace = true }
ovule-platform = { workspace = true }
ovule-extensions = { workspace = true }
ovule-toolchains = { workspace = true }

async-trait = "0.1"
iroh = { version = "1.2", default-features = false, features = [
  "portmapper",
  "tls-ring",
] }
processkit = { version = "3.3.4", features = ["tracing"] }
rand = "0.10"
russh = { version = "0.63", default-features = false, features = ["ring"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = [
  "io-util",
  "net",
  "process",
  "rt-multi-thread",
  "macros",
  "sync",
  "time",
] }
which = "8"

[dev-dependencies]
ovule-agent.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

agent-client-protocol = "2.2"
tokio-util = { version = "0.7", features = ["compat"] }

[lints]
workspace = true
