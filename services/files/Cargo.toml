[package]
name = "ovule-files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tuffite-ioc = { workspace = true }
ovule-platform = { workspace = true }
ovule-workspace = { workspace = true }
ovule-hosts = { workspace = true }

serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[dev-dependencies]
tempfile = "3"
ovule-workspace = { workspace = true, features = ["test-support"] }
