[package]
name = "ovule-extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ovule-platform = { workspace = true }
ovule-extension-api = { workspace = true }
tuffite-ioc = { workspace = true }
tracing.workspace = true
tuffite = { workspace = true, optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

[dev-dependencies]
tempfile = "3"

[features]
framework = ["dep:tuffite"]
