[package]
name = "ovule-secrets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
tuffite-ioc = { workspace = true }
ovule-platform = { workspace = true }

base64 = "0.22"
iroh = { version = "1.2", default-features = false, features = ["portmapper", "tls-ring"] }
rand = "0.10"
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
aes-gcm = { version = "0.10", default-features = false, features = ["aes", "alloc"] }
security-framework = "3.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography"] }

[dev-dependencies]
tempfile = "3"
