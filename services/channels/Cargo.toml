[package]
name = "ovule-channels"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ovule-agent-api.workspace = true
async-trait = "0.1"
ovule-conversation = { workspace = true }
ovule-extensions = { workspace = true }
tuffite-ioc = { workspace = true }
ovule-platform = { workspace = true }
ovule-secrets = { workspace = true }
ovule-toolchains = { workspace = true }
ovule-workspace = { workspace = true }
tracing.workspace = true
tuffite = { workspace = true, optional = true }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
which = "8"

[dev-dependencies]
ovule-workspace = { workspace = true, features = ["test-support"] }
tempfile = "3"

[features]
framework = ["dep:tuffite"]
