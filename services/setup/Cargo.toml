[package]
name = "ovule-setup"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
ovule-cloudflare-connectivity.workspace = true
ovule-conversation = { workspace = true, optional = true }
ovule-extensions = { workspace = true }
tuffite-ioc = { workspace = true }
ovule-platform = { workspace = true }
ovule-secrets = { workspace = true }
ovule-settings = { workspace = true }
ovule-toolchains = { workspace = true }
ovule-workspace = { workspace = true }
tracing.workspace = true
tuffite = { workspace = true, optional = true }

processkit = { version = "3.3.4", features = ["tracing"], optional = true }
serde_json = "1"
tokio = { version = "1", features = ["io-util", "rt-multi-thread", "macros", "sync", "time"], optional = true }
tokio-stream = { version = "0.1", optional = true }
ureq = { version = "3", default-features = false, features = ["rustls"] }
url = "2"
which = "8"

[features]
framework = ["dep:tuffite", "dep:ovule-conversation", "dep:processkit", "dep:tokio", "dep:tokio-stream"]
